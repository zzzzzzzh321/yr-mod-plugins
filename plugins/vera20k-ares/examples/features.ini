; One component, selected by INI. Apply in Rules or as a map Rules layer.
; All switches default to no. Overload requires Shield=yes.
[VeraFeatures]
Shield=yes
Overload=yes
AresAmmo=yes
AresReload=yes
AresNoAmmoWeapon=yes
AresManualControl=yes

; ShieldTypes/ShieldType, weapon Ammo and the four type resource tags retain
; their existing syntax. See resource-cycle.ini for a complete Ares example.
; Manual action tags are demonstrated in manual-control.ini.
