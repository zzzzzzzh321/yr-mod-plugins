; Rules/map layer for reference component 0.7.0. This file is not auto-loaded.
; Uses original LTNK and existing InvisibleLow / SA projectile/warhead types.
; Object Ammo is capacity; weapon Ammo is the cost of a fired shot.
[LTNK]
Ammo=6
InitialAmmo=6
Reload=30
EmptyReload=90
ReloadAmount=2
EmptyReloadAmount=3
NoAmmoWeapon=1
NoAmmoAmount=1
Primary=SDKResourceMain
ElitePrimary=SDKResourceMain
Secondary=SDKResourceBackup
EliteSecondary=SDKResourceBackup

[SDKResourceMain]
Damage=20
ROF=15
Range=6
Speed=100
Projectile=InvisibleLow
Warhead=SA
Ammo=2

[SDKResourceBackup]
Damage=5
ROF=15
Range=6
Speed=100
Projectile=InvisibleLow
Warhead=SA
Ammo=0

; Normal completion adds 2; exactly empty adds 3. Existing clocks still apply.
; At current ammo <=1 the selector requests Secondary, subject to earlier
; native priorities and ordinary CanFire checks. Ammo=0 makes this backup free.
; Reloading past the threshold allows normal weapon selection again.
