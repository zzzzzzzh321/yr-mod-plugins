[package]
name = "vera20k-ares"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "VERA20K external gameplay reference with INI-selected Ares policies and shield examples"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vera-mod-api = { path = "../../sdk/api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wit-bindgen = "=0.51.0"
